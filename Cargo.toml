[package]
name = "lenso-projects-web-plugin"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/LioRael/lenso-projects-web-plugin"
description = "Standalone linked Web endpoint for the Lenso Projects capabilities."
publish = true

[package.metadata.lenso]
plugin-id = "lenso.projects.web"
root-slot = "web"

[dependencies]
time = "0.3"
lenso-capability-organization-membership-admin = "0.3.0"
lenso-capability-organization-directory = "0.3.0"
futures = "0.3"
lenso = { version = "0.5.17" }
lenso-auth-sdk = { version = "0.2.3" }
lenso-capability-auth = { version = "0.2.0" }
lenso-capability-http-endpoint = { version = "0.3.0" }
lenso-capability-projects = { version = "0.2.0" }
lenso-capability-projects-admin = { version = "0.2.0" }
lenso-capability-projects-collaboration = { version = "0.3.0" }
lenso-kernel = { version = "0.3.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
lenso-app-plan = { version = "0.4.1" }
lenso-native-adapter = { version = "0.3.13" }
lenso-runner = { version = "0.2.13" }
time = "0.3"
tokio = { version = "1.52", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
