name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run format:check --prefix web
      - run: npm run check:assets --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test --prefix web
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: ./scripts/check-repository-boundary.sh
      - run: ./scripts/check-public-packages.sh
